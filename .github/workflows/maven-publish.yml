name: Maven Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          java-package: jdk
          cache: maven
          check-latest: false

      - name: Verify Java
        run: |
          java -version
          javac -version
          mvn -version

      - name: Maven Build
        run: mvn clean package
